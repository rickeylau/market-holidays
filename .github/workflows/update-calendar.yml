
name: Update Market Holidays

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-holidays-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate Market Holidays
        run: python market_holidays.py

      - name: Publish calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add holidays.json market-holidays.ics
          if git diff --cached --quiet; then
            echo 'No calendar changes.'
            exit 0
          fi
          git commit -m 'Update market holidays'
          git push
